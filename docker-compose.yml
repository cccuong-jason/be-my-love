version: '3.8'

services:
  app:
    container_name: be-my-love-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000" # Back to 3001 to avoid 3000 conflicts
    volumes:
      - .:/app
      - bun_modules:/app/node_modules
      - next_cache:/app/.next # 🚀 Named volume for Next.js build cache (PERFORMANCE FIX)
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/be-my-love
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-https://s3.cloudfly.vn}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-be-my-love-assets}
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  mongo:
    container_name: be-my-love-mongo
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
  bun_modules:
  next_cache: # Define the cache volume
